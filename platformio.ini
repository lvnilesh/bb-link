[platformio]
default_envs = atom-lite
src_dir = src/bb-link

[env:atom-lite]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
board_build.partitions = min_spiffs.csv
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    thijse/ArduinoLog@1.1.1
    EinarArnason/ArduinoQueue@1.2.5
    m5stack/M5Atom@0.1.3
    fastled/FastLED@3.6.0
